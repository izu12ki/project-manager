name: CI
on:
  push:
    branches: [main]
  pull_request:

# 同じ PR に新しい push が来たら古い実行を止める（main は最後まで流す）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm docs:build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      # ヘッドレス実行だけなのでフル版 Chromium は入れない。
      # 依存ライブラリはランナーイメージに揃っているので --with-deps（apt）も省く
      - run: pnpm --filter web exec playwright install --only-shell chromium
      - run: pnpm test:e2e
        env:
          WRANGLER_SEND_METRICS: 'false'
      # E2E は wrangler dev しか使わないので、wrangler deploy が設定を読んで Worker を組み立てられるかも確かめる。
      # E2E がビルドした成果物をそのまま使う。--dry-run はアップロードせず、認証も要らない
      - run: pnpm --filter web exec wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
