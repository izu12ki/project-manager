name: Release

# changeset が溜まっていれば「Version Packages」PR を作成・更新し、
# その PR がマージされたら web@x.y.z タグと GitHub Release を作って、ドキュメントサイトをデプロイする（npm には公開しない）。
# 手動実行（workflow_dispatch）はドキュメントのデプロイだけを行う。リリースを待たずにドキュメントの修正を出すときに使う
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    # ブランチの push と PR の作成は下の App トークンで行うので、GITHUB_TOKEN は読むだけ
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # CHANGELOG に changeset を足したコミットを載せるため履歴が要る。
          # 浅いクローンだと changeset version が git fetch --deepen を走らせ、
          # 認証情報を残していないので private リポジトリでは失敗する
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      # GITHUB_TOKEN で作った PR や push では CI が走らない。main は check と e2e を必須にしているので、
      # リリース PR は GitHub App のトークンで作り、CI を走らせる。権限はこのリポジトリの contents と PR の書き込みだけに絞る
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: changesets/action/version@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: release'
          pr-title: 'chore: release'

  publish:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      # 全パッケージが private なので、changeset publish はタグを作るだけで npm には公開しない
      - id: publish
        uses: changesets/action/publish@v2

  # ドキュメントはセルフホストの人が使う最新リリースに合わせる。
  # publish モードは changeset の無い main への push のたびに走るので、実際にタグを作ったときだけデプロイする
  deploy-docs:
    needs: publish
    # 手動実行では publish が skipped になるので !cancelled() で評価させる。フォークでは動かさない
    if: >-
      !cancelled() &&
      github.repository == 'izu12ki/project-manager' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (needs.publish.result == 'success' && needs.publish.outputs.published == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - run: pnpm --filter docs exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
