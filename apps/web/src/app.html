<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script nonce="%sveltekit.nonce%">
			// 描画前にテーマと文字の大きさを確定させてちらつきを防ぐ（テーマの保存値がなければ OS 設定に従う）
			(function () {
				var t = null;
				try {
					t = localStorage.getItem('theme');
				} catch (e) {}
				if (t !== 'light' && t !== 'dark')
					t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.dataset.theme = t;
				var f = null;
				try {
					f = localStorage.getItem('font-size');
				} catch (e) {}
				if (f === 'large' || f === 'xlarge') document.documentElement.dataset.fontSize = f;
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
